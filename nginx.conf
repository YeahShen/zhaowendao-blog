# Server block installed at /etc/nginx/conf.d/default.conf.
# The surrounding http{} context comes from the stock nginx image config.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Static site: no CSP because the theme injects inline scripts.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # `$uri.html` keeps links working even if pretty_urls starts dropping .html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Static assets rarely change: cache them at the browser/edge.
    # (expires sets Cache-Control without clobbering the add_header block above)
    location ~* \.(?:css|js|mjs|map|woff2?|ttf|otf|eot|ico|svg|png|jpe?g|gif|webp|avif)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # HTML must revalidate so new posts show up without a hard refresh
    location ~* \.html$ {
        expires -1;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}